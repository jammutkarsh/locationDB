name: Build and Publish SQLite DB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: "Build from scratch instead of upserting into the published DB"
        type: boolean
        default: false

  # GeoNames regenerates its dump files daily.
  schedule:
    - cron: "0 3 * * *"

# Each run upserts into the previous run's output; never let two overlap.
concurrency:
  group: publish-r2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 curl unzip zstd

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          rm -rf aws awscliv2.zip

      # Upsert into what's published so ids and rows from earlier builds are
      # kept. Fail rather than silently fall back to a fresh build: that would
      # drop every city GeoNames no longer lists. Use the `fresh` input to
      # bootstrap on purpose.
      - name: Fetch published database
        if: ${{ !inputs.fresh }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp s3://locationdb/location.db.zst location.db.zst
          zstd -d -f location.db.zst -o location.db

      - name: Build database
        run: |
          chmod +x populate.sh
          ./populate.sh \
            --driver sqlite \
            --db-path location.db

      - name: Generate metadata
        run: |
          SHA=$(sha256sum location.db | awk '{print $1}')
          ZST_SHA=$(sha256sum location.db.zst | awk '{print $1}')
          SIZE=$(stat -c%s location.db)
          ZST_SIZE=$(stat -c%s location.db.zst)
          ROWS_GEONAMES_CITIES=$(sqlite3 location.db "SELECT COUNT(*) FROM geonames_cities;")
          ROWS_GEONAMES_STATES=$(sqlite3 location.db "SELECT COUNT(*) FROM geonames_states;")
          ROWS_GEONAMES_COUNTRIES=$(sqlite3 location.db "SELECT COUNT(*) FROM geonames_countries;")
          ROWS_GEONAMES_TRIGRAMS=$(sqlite3 location.db "SELECT COUNT(*) FROM geonames_trigrams;")

          cat > location.json <<EOF
          {
            "version":"$(date -u +%Y-%m-%d)",
            "updated":"$(date -u +%FT%TZ)",
            "sha256":"$SHA",
            "size":$SIZE,
            "zst": {
              "sha256":"$ZST_SHA",
              "size":$ZST_SIZE,
              "url":"https://locationdb.utkarshchourasia.in/location.db.zst"
            },
            "rows":{
              "geonames_cities":$ROWS_GEONAMES_CITIES,
              "geonames_states":$ROWS_GEONAMES_STATES,
              "geonames_countries":$ROWS_GEONAMES_COUNTRIES,
              "geonames_trigrams":$ROWS_GEONAMES_TRIGRAMS
            }
          }
          EOF

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp location.db.zst s3://locationdb/location.db.zst
          aws s3 cp location.json  s3://locationdb/location.json

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://locationdb.utkarshchourasia.in/location.db.zst",
              "https://locationdb.utkarshchourasia.in/location.json"
            ]}'